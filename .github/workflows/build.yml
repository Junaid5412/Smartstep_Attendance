name: Build APK & iOS

on:
  push:
    branches: [ main ]
    paths:
      - 'APK/**'
      - 'IOS/**'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build Android APK'
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS IPA'
        type: boolean
        default: true

# ──────────────────────────────────────────────
#  ANDROID — Signed Release APK + AAB
# ──────────────────────────────────────────────
jobs:
  build-android:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_apk == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Get dependencies
        working-directory: APK
        run: flutter pub get

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > APK/android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > APK/android/key.properties << EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: APK
        run: flutter build apk --release

      - name: Build release AAB (Play Store)
        working-directory: APK
        run: flutter build appbundle --release

      - name: Rename outputs with version
        run: |
          VERSION=$(grep '^version:' APK/pubspec.yaml | sed 's/version: //')
          cp APK/build/app/outputs/flutter-apk/app-release.apk \
             APK/build/app/outputs/flutter-apk/SST-Attendance-${VERSION}.apk
          cp APK/build/app/outputs/bundle/release/app-release.aab \
             APK/build/app/outputs/bundle/release/SST-Attendance-${VERSION}.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SST-Attendance-APK
          path: APK/build/app/outputs/flutter-apk/SST-Attendance-*.apk
          retention-days: 90

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: SST-Attendance-AAB
          path: APK/build/app/outputs/bundle/release/SST-Attendance-*.aab
          retention-days: 90

# ──────────────────────────────────────────────
#  iOS — Unsigned IPA (sideload via Sideloadly)
# ──────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_ios == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Get dependencies
        working-directory: IOS
        run: flutter pub get

      - name: Build iOS (unsigned)
        working-directory: IOS
        run: flutter build ios --release --no-codesign

      - name: Package as IPA
        working-directory: IOS
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          zip -r SST-Attendance-${VERSION}.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SST-Attendance-IOS
          path: IOS/SST-Attendance-*.ipa
          retention-days: 90
